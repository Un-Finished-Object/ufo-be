spring:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  forward-headers-strategy: framework

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

app:
  referral:
    hmac-secret: ${REFERRAL_HMAC_SECRET:}
  chat:
    segment-days: 7
  oauth:
    redirect-url: ${OAUTH_REDIRECT_URL:}
    signup-redirect-url: ${OAUTH_SIGNUP_REDIRECT_URL:}
    admin-redirect-url: ${OAUTH_ADMIN_REDIRECT_URL:}
    cookie-domain: ${OAUTH_COOKIE_DOMAIN:}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - ${DOMAIN_URL:}
  image:
    max-file-count: 5
    max-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    cdn-base-url: ${CDN_BASE_URL:}
    default-profile-image-key: ${DEFAULT_PROFILE_IMAGE_KEY:defaults/profile.png}
    s3:
      bucket: ${S3_IMAGE_BUCKET:}
      region: ${S3_REGION:ap-northeast-2}
      url-expiration-minutes: 5
      public-base-url: ${S3_PUBLIC_BASE_URL:}
