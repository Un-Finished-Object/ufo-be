spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRE:7200000}
    refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRE:1209600000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/v1/auth/oauth/google/callback"
            scope:
              - email
              - profile
              - openid
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/v1/auth/oauth/kakao/callback"
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/v1/auth/oauth/naver/callback"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
app:
  referral:
    hmac-secret: ${REFERRAL_HMAC_SECRET}
  oauth:
    redirect-url: ${OAUTH_REDIRECT_URL}
    signup-redirect-url: ${OAUTH_SIGNUP_REDIRECT_URL}
    admin-redirect-url: ${OAUTH_ADMIN_REDIRECT_URL}
  image:
    cdn-base-url: ${CDN_BASE_URL}
    s3:
      bucket: ${S3_IMAGE_BUCKET}
      public-base-url: ${S3_PUBLIC_BASE_URL}
